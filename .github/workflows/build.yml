name: build
on: [push, pull_request]
permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build and test
        run: |
          go build ./...
          go test ./...
          go vet ./...
      - name: Compile and validate native launcher
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p dist
          VERSION=$(tr -d '\r\n' < VERSION)
          go build -ldflags "-X main.version=$VERSION" -o dist/obs-cli .
          ./integrations/macos/build_test.sh
