# obs-cli configuration file
# Schema reference for LSP support (e.g., Even Better TOML extension)
#:schema ./config.schema.json

# OBS WebSocket server host
# Can be overridden with OBS_CLI_HOST environment variable or --host flag
host = "localhost"

# OBS WebSocket server port
# Default is 4455 for OBS 28+ (was 4444 for older versions)
# Can be overridden with OBS_CLI_PORT environment variable or --port flag
port = 4455

# OBS WebSocket server password
# Leave empty if authentication is disabled in OBS
# Can be overridden with OBS_CLI_PASSWORD environment variable or --password flag
password = ""

# Server profiles allow you to define multiple OBS servers
# Use with: obs-cli --profile <name> <command>
#
# [[profiles]]
# name = "local"
# host = "localhost"
# port = 4455
# password = ""
#
# [[profiles]]
# name = "streaming-pc"
# host = "192.168.1.100"
# port = 4455
# password = "your-secret-password"
#
# [[profiles]]
# name = "studio"
# host = "obs-studio.local"
# port = 4455
# password = "studio-password"

# Named recording sessions (OBS must already be configured to these bindings).
[recording_session]
base_directory = "~/Movies"
scene_collection = "MultiTrack"
obs_profile = "MultiTrack"
scene = "Composite"
source_names = ["Desktop", "Cam Link"]
filter_name = "Source Record"
# screen follows actual Desktop capture dimensions; 16:9 fits; keep preserves layout.
composition = "screen"
# Maximum program output edge, even pixels, no screen-mode upscaling.
output_max_dimension = 1920
